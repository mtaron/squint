# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  infrastructure:
    taskfile: ./infrastructure/Taskfile.yaml
    dir: ./infrastructure
    flatten: true
  ui:
    taskfile: ./squint/javascript/Taskfile.javascript.yaml
    dir: ./squint/javascript/ui
  worker:
    taskfile: ./squint/javascript/Taskfile.javascript.yaml
    dir: ./squint/javascript/worker
  squint-core:
    taskfile: ./squint/python/Taskfile.python.yaml
    dir: ./squint/python/packages/squint-core
  embed:
    taskfile: ./squint/python/Taskfile.python.yaml
    dir: ./squint/python/apps/embed
  ingest:
    taskfile: ./squint/python/Taskfile.python.yaml
    dir: ./squint/python/apps/ingest
  extract:
    taskfile: ./squint/python/Taskfile.python.yaml
    dir: ./squint/python/apps/extract

tasks:
  dev:
    desc: Run Tilt against the dev cluster
    cmds:
      - task: download-models
      - tilt up

  preview:
    desc: Run Tilt with the production build, like `vite preview`
    cmds:
      - task: download-models
      - tilt up -- --preview

  update-dev-dependencies:
    desc: Update mise dependencies
    cmd: mise upgrade --local

  download-datasets:
    cmds:
      - for:
          - "vidore/vidore_v3_hr"
          - "vidore/vidore_v3_finance_en"
          - "vidore/vidore_v3_industrial"
          - "vidore/vidore_v3_pharmaceuticals"
          - "vidore/vidore_v3_computer_science"
          - "vidore/vidore_v3_energy"
          - "vidore/vidore_v3_physics"
          - "vidore/vidore_v3_finance_fr"
          - "allenai/olmOCR-bench"
          - "llamaindex/ExtractBench"
        cmd: hf download --type dataset --local-dir datasets/{{ .ITEM | quote }} {{ .ITEM | quote }}

  download-models:
    desc: Download the models and kernels the cluster mounts at /mnt/models
    vars:
      # The embed worker pins its FlashAttention 2 kernel in kernels.lock (`kernels lock .`)
      FLASH_ATTN_REVISION:
        sh: yq --input-format json --output-format yaml '.[] | select(.dependency.repo-id == "kernels-community/flash-attn2") | .lock.commit' squint/python/apps/embed/kernels.lock
    cmds:
      - hf download --local-dir models/NeoMME-260M-Retriever Hcompany/NeoMME-260M-Retriever
      - hf download --local-dir models/Qwen3.5-4B-FP8-dynamic RedHatAI/Qwen3.5-4B-FP8-dynamic
      # Only the build for the embed image's torch (stable ABI, CUDA 13.0); the repo holds every variant
      - >-
        hf download --type kernel --revision {{.FLASH_ATTN_REVISION}}
        --include 'build/torch-stable-abi210-cu130-x86_64-linux/*'
        --local-dir models/kernels/flash-attn2 kernels-community/flash-attn2
    status:
      - test -d models/NeoMME-260M-Retriever
      - test -d models/Qwen3.5-4B-FP8-dynamic
      - test -d models/kernels/flash-attn2

  create-admin:
    desc: Create the dev admin account; needs the dev ui image, not `task preview`
    cmd: >-
      kubectl exec --namespace squint deploy/ui --
      sh -c 'auth create-admin --config src/lib/server/auth.ts --yes
      --name Admin --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD"'

  admin-credentials:
    desc: Print the dev admin account's email and password
    cmd: kubectl exec --namespace squint deploy/ui -- printenv ADMIN_EMAIL ADMIN_PASSWORD
    silent: true

  remove-user:
    desc: "Delete a user and clean up their resources, e.g. `task remove-user EMAIL=test@example.com`"
    requires:
      vars: [EMAIL]
    cmd: kubectl exec --namespace squint deploy/ui -- node scripts/remove-user.ts {{shellQuote .EMAIL}}

  test:
    desc: Run every JS and Python test suite
    cmds:
      - task: ui:test
      - task: worker:test
      - task: squint-core:test
      - task: embed:test
      - task: ingest:test
      - task: extract:test

  test-changed:
    desc: Run only the JS and Python tests affected by changes since their last run
    cmds:
      - task: ui:test-changed
      - task: worker:test-changed
      - task: squint-core:test-changed
      - task: embed:test-changed
      - task: ingest:test-changed
      - task: extract:test-changed

  update-python-dependencies:
    desc: Upgrade every Python project's uv.lock and sync its .venv
    vars:
      PROJECTS:
        sh: find squint/python -name pyproject.toml -not -path '*/.venv/*' -printf '%h\n'
    cmds:
      - for: { var: PROJECTS }
        cmd: uv sync --upgrade --directory {{.ITEM}}

  gpu-usage:
    desc: Show where local GPU memory is allocated
    cmds:
      - nvidia-smi --query-compute-apps=used_memory,pid,process_name --format=csv,nounits | (read -r h; echo "$h"; sort -t, -k1,1 -nr) | bat --language=csv
