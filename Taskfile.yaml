# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  infrastructure:
    taskfile: ./infrastructure/Taskfile.yaml
    dir: ./infrastructure
    flatten: true

tasks:
  dev:
    desc: Run Tilt against the dev cluster
    cmds:
      - task: download-models
      - tilt up

  download-datasets:
    cmds:
      - for:
          - "vidore/vidore_v3_hr"
          - "vidore/vidore_v3_finance_en"
          - "vidore/vidore_v3_industrial"
          - "vidore/vidore_v3_pharmaceuticals"
          - "vidore/vidore_v3_computer_science"
          - "vidore/vidore_v3_energy"
          - "vidore/vidore_v3_physics"
          - "vidore/vidore_v3_finance_fr"
          - "allenai/olmOCR-bench"
          - "llamaindex/ExtractBench"
        cmd: hf download --type dataset --local-dir datasets/{{ .ITEM | quote }} {{ .ITEM | quote }}

  download-models:
    desc: Download the models and kernels the cluster mounts at /mnt/models
    vars:
      # The embed worker pins its FlashAttention 2 kernel in kernels.lock (`kernels lock .`)
      FLASH_ATTN_REVISION:
        sh: yq --input-format json --output-format yaml '.[] | select(.dependency.repo-id == "kernels-community/flash-attn2") | .lock.commit' squint/python/apps/embed/kernels.lock
    cmds:
      - hf download --local-dir models/NeoMME-260M-Retriever Hcompany/NeoMME-260M-Retriever
      - hf download --local-dir models/Qwen3-VL-4B-Instruct Qwen/Qwen3-VL-4B-Instruct
      # Only the build for the embed image's torch (stable ABI, CUDA 13.0); the repo holds every variant
      - >-
        hf download --type kernel --revision {{.FLASH_ATTN_REVISION}}
        --include 'build/torch-stable-abi210-cu130-x86_64-linux/*'
        --local-dir models/kernels/flash-attn2 kernels-community/flash-attn2
    status:
      - test -d models/NeoMME-260M-Retriever
      - test -d models/Qwen3-VL-4B-Instruct
      - test -d models/kernels/flash-attn2

  venvs:
    desc: (Re)create every Python project's .venv with uv
    vars:
      PROJECTS:
        sh: find squint/python -name pyproject.toml -not -path '*/.venv/*' -printf '%h\n'
    cmds:
      - for: { var: PROJECTS }
        cmd: rm -rf {{.ITEM}}/.venv && uv sync --directory {{.ITEM}}

  gpu-usage:
    desc: Show where local GPU memory is allocated
    cmds:
      - nvidia-smi --query-compute-apps=used_memory,pid,process_name --format=csv,nounits | (read -r h; echo "$h"; sort -t, -k1,1 -nr) | bat --language=csv
