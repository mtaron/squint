# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GATEWAY_API_VERSION: "1.6.2"
  GATEWAY_API_INFERENCE_EXTENSION_VERSION: "1.6.2"
  ENVIRONMENT: '{{default "development" .ENVIRONMENT}}'

tasks:
  create-dev-cluster:
    desc: Create local development cluster
    cmds:
      - nvkind cluster create --name squint --config-template cluster.yaml
      # A new cluster has none of the dev images, whatever the image checksums say
      - "{{.TASK_EXE}} --dir {{.ROOT_DIR}} --force images"
    env:
      SQUINT_SOURCE_DIR: "{{.ROOT_DIR}}/squint"
    silent: true
    status:
      - kind get kubeconfig --name squint

  lb-dev-cluster:
    desc: Run the dev cluster load balancer
    cmd: cloud-provider-kind --gateway-channel disabled # Gateway API CRDs are installed manually

  get-lb-ip:
    desc: Get the load balancer IP for the dev cluster
    cmd: kubectl get svc --namespace squint agentgateway-proxy -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" ; echo

  delete-dev-cluster:
    desc: Delete local development cluster
    cmd: kind delete cluster --name squint
    silent: true

  grafana:
    desc: Forward Grafana to http://localhost:3000
    cmd: kubectl port-forward --namespace monitoring svc/kube-prometheus-stack-grafana 3000:80

  temporal-ui:
    desc: Forward the Temporal UI to http://localhost:8080
    cmd: kubectl port-forward --namespace temporal svc/temporal-web 8080

  vendor-crds:
    desc: Download vendored custom resource definitions
    silent: true
    cmds:
      # gateway-api
      - curl --show-error --silent --fail --location https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{.GATEWAY_API_VERSION}}/standard-install.yaml --output ./gateway-api/templates/crds.yaml
      - yq '.version = {{.GATEWAY_API_VERSION | quote}}' --inplace ./gateway-api/Chart.yaml
      # gateway-api-inference-extension
      - curl --show-error --silent --fail --location https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/v{{.GATEWAY_API_INFERENCE_EXTENSION_VERSION}}/v1-manifests.yaml --output ./gateway-api-inference-extension/templates/crds.yaml
      - yq '.version = {{.GATEWAY_API_INFERENCE_EXTENSION_VERSION | quote}}' --inplace ./gateway-api-inference-extension/Chart.yaml

  deploy:
    desc: Apply the helmfile
    requires:
      vars:
        - name: ENVIRONMENT
          enum: [development, staging, production]
    cmd: helmfile --environment {{.ENVIRONMENT}} apply --skip-diff-on-install
