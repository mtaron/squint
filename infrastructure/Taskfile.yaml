# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GATEWAY_API_VERSION: "1.6.2"
  GATEWAY_API_INFERENCE_EXTENSION_VERSION: "1.6.2"
  ENVIRONMENT: '{{default "development" .ENVIRONMENT}}'
  KUBE_CONTEXTS:
    map:
      development: kind-squint
      staging: ""
      production: ""

tasks:
  create-dev-cluster:
    desc: Create local development cluster
    cmd: nvkind cluster create --name squint --config-template cluster.yaml
    silent: true
    status:
      - kind get kubeconfig --name squint

  delete-dev-cluster:
    desc: Delete local development cluster
    cmd: kind delete cluster --name squint
    silent: true

  vendor-crds:
    desc: Download vendored custom resource definitions
    silent: true
    cmds:
      # gateway-api
      - curl --show-error --silent --fail --location https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{.GATEWAY_API_VERSION}}/standard-install.yaml --output ./gateway-api/templates/crds.yaml
      - yq '.version = {{.GATEWAY_API_VERSION | quote}}' --inplace ./gateway-api/Chart.yaml
      # gateway-api-inference-extension
      - curl --show-error --silent --fail --location https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/v{{.GATEWAY_API_INFERENCE_EXTENSION_VERSION}}/v1-manifests.yaml --output ./gateway-api-inference-extension/templates/crds.yaml
      - yq '.version = {{.GATEWAY_API_INFERENCE_EXTENSION_VERSION | quote}}' --inplace ./gateway-api-inference-extension/Chart.yaml

  deploy:
    desc: Apply the helmfile
    vars:
      KUBE_CONTEXT: '{{index .KUBE_CONTEXTS .ENVIRONMENT}}'
    requires:
      vars:
        - name: ENVIRONMENT
          enum: [development, staging, production]
    cmd: helmfile --environment {{.ENVIRONMENT}} --kube-context {{.KUBE_CONTEXT}} apply
