# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  # https://github.com/kubernetes-sigs/gateway-api/releases
  GATEWAY_API_VERSION: "1.6.3"
  ENVIRONMENT: '{{default "development" .ENVIRONMENT}}'
  CERT_DIR: "{{.PROJECT_ROOT}}/.certs"
  REGISTRY_NAME: kind-registry
  REGISTRY_HOST: registry.localhost
  GATEWAY_HOST: squint.loc

tasks:
  create-dev-cluster:
    desc: Create local development cluster
    cmds:
      - task: install-local-certs
      - ./kind/create.sh
      - task: deploy
    env:
      CERT_DIR: "{{.CERT_DIR}}"
      REGISTRY_NAME: "{{.REGISTRY_NAME}}"
    silent: true
    status:
      - kind get kubeconfig --name squint

  delete-dev-cluster:
    desc: Delete local development cluster
    cmd: kind delete cluster --name squint
    silent: true

  install-local-certs:
    desc: Install the mkcert CA and generate a locally trusted dev certificate
    vars:
      HOSTS: localhost 127.0.0.1 ::1 {{.REGISTRY_HOST}} {{.REGISTRY_NAME}}
    preconditions:
      - sh: command -v certutil
        msg: Install the NSS tools first, e.g. `sudo apt install libnss3-tools`
    cmds:
      # Chromium-based browsers only create their NSS store on first use, and mkcert skips a missing one
      - test -d ~/.pki/nssdb || (mkdir -p ~/.pki/nssdb && certutil -d sql:$HOME/.pki/nssdb -N --empty-password)
      - mkcert -install
      - mkdir -p {{.CERT_DIR}}
      - cp "$(mkcert -CAROOT)/rootCA.pem" {{.CERT_DIR}}/rootCA.pem
      - mkcert -cert-file {{.CERT_DIR}}/dev.pem -key-file {{.CERT_DIR}}/dev-key.pem {{.HOSTS}}
      # The Docker daemon only reads the system CA store at startup, so trust the CA for the registry explicitly
      - sudo install -D --mode 644 {{.CERT_DIR}}/rootCA.pem /etc/docker/certs.d/{{.REGISTRY_HOST}}/ca.crt
    status:
      - test -f {{.CERT_DIR}}/rootCA.pem
      - test -f {{.CERT_DIR}}/dev.pem
      - test -f {{.CERT_DIR}}/dev-key.pem
      - test -d ~/.pki/nssdb
    silent: true

  gateway-cert:
    desc: Serve the gateway's HTTPS listener with a locally trusted certificate for {{.GATEWAY_HOST}} and its subdomains
    cmds:
      - mkcert -cert-file {{.CERT_DIR}}/gateway.pem -key-file {{.CERT_DIR}}/gateway-key.pem {{.GATEWAY_HOST}} '*.{{.GATEWAY_HOST}}'
      - >-
        kubectl create secret tls gateway-tls --namespace agentgateway-system
        --cert {{.CERT_DIR}}/gateway.pem --key {{.CERT_DIR}}/gateway-key.pem
        --dry-run=client --output yaml | kubectl apply --filename -
    status:
      - test -f {{.CERT_DIR}}/gateway.pem
      - kubectl get secret gateway-tls --namespace agentgateway-system
    silent: true
    internal: true

  lb-dev-cluster:
    desc: Run the dev cluster load balancer
    if: "! pgrep --full '(^|/)cloud-provider-kind( |$)'"  # Run only a single instance
    cmd: cloud-provider-kind --gateway-channel disabled # Gateway API CRDs are installed manually

  dev-hosts:
    desc: Point {{.GATEWAY_HOST}} and its subdomains at the dev cluster load balancer with a hostctl profile
    vars:
      GATEWAY_IP:
        sh: kubectl get gateway --namespace agentgateway-system agentgateway-proxy -o jsonpath='{.status.addresses[0].value}' ; echo
      # The UI's route matches every host, so only subdomains are listed on routes
      ROUTE_HOSTNAMES:
        sh: kubectl get httproute --all-namespaces -o jsonpath='{.items[*].spec.hostnames[*]}'
    preconditions:
      - sh: test -n "{{.GATEWAY_IP}}"
        msg: The gateway has no address; run `task lb-dev-cluster`
    cmd: printf '{{.GATEWAY_IP}} %s\n' {{.GATEWAY_HOST}} {{.ROUTE_HOSTNAMES}} | sudo "$(command -v hostctl)" replace squint --quiet
    silent: true

  vllm:
    desc: Forward the Qwen3-VL vLLM server to http://localhost:8000
    cmd: kubectl port-forward --namespace vllm svc/qwen3-vl-vllm-engine-service 8000:80

  vendor-crds:
    desc: Download vendored custom resource definitions
    silent: true
    cmds:
      # gateway-api
      - curl --show-error --silent --fail --location https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{.GATEWAY_API_VERSION}}/standard-install.yaml --output ./gateway-api/templates/crds.yaml
      - yq '.version = {{.GATEWAY_API_VERSION | quote}}' --inplace ./gateway-api/Chart.yaml

  vendor-dashboards:
    desc: Download vendored Grafana dashboards
    silent: true
    vars:
      # https://github.com/NVIDIA/dcgm-exporter/releases
      DCGM_EXPORTER_VERSION: "4.8.4"
      # https://github.com/milvus-io/milvus/releases; keep in step with ./milvus/templates/milvus.yaml
      MILVUS_VERSION: "v3.0.2"
      # https://github.com/temporalio/dashboards/commits/main, since the repo has no releases
      TEMPORAL_DASHBOARDS_COMMIT: 4994df2cf98a901ec78217c111eda95ff087480d
    cmds:
      - curl --show-error --silent --fail --location https://raw.githubusercontent.com/NVIDIA/dcgm-exporter/{{.DCGM_EXPORTER_VERSION}}/grafana/dcgm-exporter-dashboard.json --output ./dashboards/files/dcgm-exporter.json
      - curl --show-error --silent --fail --location https://raw.githubusercontent.com/temporalio/dashboards/{{.TEMPORAL_DASHBOARDS_COMMIT}}/server/server-general.json --output ./dashboards/files/temporal-server.json
      # Some Milvus panels name the upstream author's Prometheus datasource rather than the dashboard's variable
      - >-
        curl --show-error --silent --fail --location https://raw.githubusercontent.com/milvus-io/milvus/{{.MILVUS_VERSION}}/deployments/monitor/grafana/milvus-dashboard.json
        | jq 'walk(if type == "object" and .datasource.type? == "prometheus" then .datasource.uid = "${datasource}" else . end)'
        > ./dashboards/files/milvus.json

  deploy:
    desc: Apply the helmfile
    requires:
      vars:
        - name: ENVIRONMENT
          enum: [development, staging, production]
    cmd: helmfile --environment {{.ENVIRONMENT}} apply --skip-diff-on-install
