kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: squint
# One control plane node and a worker that mounts all local GPUs.
#
# The API-server and other control plane components will be
# on the control-plane node. Having a seperate worker node
# allows cloud-provider-kind to work out of the box without
# relabeling the control plane to allow load balancers.
nodes:
- role: control-plane
- role: worker
  extraMounts:
    - hostPath: /dev/null
      containerPath: /var/run/nvidia-container-devices/all
