# Server certificate. Its ca.crt (dragonfly-ca) also verifies client certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: dragonfly-tls
  dnsNames:
    - squint
    - squint.{{ .Release.Namespace }}
    - squint.{{ .Release.Namespace }}.svc
    - squint.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
  # Dragonfly does not reload rotated certificates (dragonfly-operator#151)
  duration: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: dragonfly-ca
