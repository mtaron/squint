apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: dragonfly-tls
  dnsNames:
    - squint.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: squint-ca
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: squint
  namespace: {{ .Release.Namespace }}
  labels:
    app: dragonfly
spec:
  replicas: 2
  tlsSecretRef:
    name: dragonfly-tls
  authentication:
    clientCaCertSecret:
      name: dragonfly-tls
      key: ca.crt
