apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: squint
  namespace: {{ .Release.Namespace }}
  labels:
    app: dragonfly
spec:
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
  replicas: 2
  tlsSecretRef:
    name: dragonfly-tls
  authentication:
    clientCaCertSecret:
      name: dragonfly-tls
      key: ca.crt
