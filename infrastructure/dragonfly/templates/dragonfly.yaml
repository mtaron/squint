apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: squint
  namespace: {{ .Release.Namespace }}
  labels:
    app: dragonfly
spec:
  replicas: 2
  tlsSecretRef:
    name: dragonfly-tls
  # Any client certificate signed by dragonfly-ca is accepted; no password.
  # Replication and health checks use the operator's plaintext admin port.
  authentication:
    clientCaCertSecret:
      name: dragonfly-tls
      key: ca.crt
