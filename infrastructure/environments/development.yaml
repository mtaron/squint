# Development environment values
# These values are available in helmfile.yaml as {{ .Values }}
s3:
  region: us-west-2

gpu-operator:
  timeSlicing:
    replicas: 2
  values:
    # nvkind uses the host's GPU driver and installs the container toolkit
    # into the kind nodes itself.
    - driver:
        enabled: false
    - toolkit:
        enabled: false

milvus:
  values:
    - route:
        enabled: true
        hostnames:
          - milvus.squint.loc

temporal:
  values:
    # The chart has no Gateway API route of its own
    - extraObjects:
        - |
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: temporal-web
            namespace: {{ .Release.Namespace }}
          spec:
            parentRefs:
              - name: agentgateway-proxy
                namespace: agentgateway-system
                sectionName: https
            hostnames:
              - temporal.squint.loc
            rules:
              - backendRefs:
                  - name: temporal-web
                    port: 8080

kube-prometheus-stack:
  values:
    - grafana:
        route:
          main:
            enabled: true
            hostnames:
              - grafana.squint.loc
            parentRefs: &gatewayHttps
              - name: agentgateway-proxy
                namespace: agentgateway-system
                sectionName: https
        grafana.ini:
          server:
            root_url: https://grafana.squint.loc
          auth:
            disable_login_form: true
          auth.anonymous:
            enabled: true
            org_role: Admin
      prometheus:
        route:
          main:
            enabled: true
            hostnames:
              - prometheus.squint.loc
            parentRefs: *gatewayHttps
        prometheusSpec:
          externalUrl: https://prometheus.squint.loc
      alertmanager:
        route:
          main:
            enabled: true
            hostnames:
              - alertmanager.squint.loc
            parentRefs: *gatewayHttps
        alertmanagerSpec:
          externalUrl: https://alertmanager.squint.loc
