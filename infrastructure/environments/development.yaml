# Development environment values
# These values are available in helmfile.yaml as {{ .Values }}
gpu-operator:
  values:
    # nvkind uses the host's GPU driver and installs the container toolkit
    # into the kind nodes itself.
    - driver:
        enabled: false
    - toolkit:
        enabled: false

squint:
  values:
    - grafanaIngress:
        enabled: true

kube-prometheus-stack:
  grafana:
    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true
