apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: floci-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: floci-tls
  dnsNames:
    - floci.{{ .Release.Namespace }}.svc.cluster.local
    - floci.{{ .Release.Namespace }}.svc
    - floci
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: squint-ca
