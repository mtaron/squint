{{- with .Values.route.hostnames }}
# The gateway terminates TLS; Floci serves plain HTTP and HTTPS on the same port
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: floci
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: https
  hostnames:
    {{- toYaml . | nindent 4 }}
  rules:
    - backendRefs:
        - name: floci
          port: 4566
{{- end }}
