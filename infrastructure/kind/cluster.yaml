# yaml-language-server: $schema=https://www.schemastore.org/kind-cluster.json

# This is a nvkind-flavor templated kind configuration
# https://github.com/NVIDIA/nvkind/blob/main/examples/one-worker-per-gpu.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
# yaml-language-server-disable
{{- range $gpu := until numGPUs }}
- role: worker
  labels:
    nvidia.com/gpu.present: "true"
  extraMounts:
    # Inject the GPU using the nvidia-container-runtime.
    # This requires `accept-nvidia-visible-devices-as-volume-mounts = true` be set
    # in `/etc/nvidia-container-runtime/config.toml` on the host; see README.md.
    - hostPath: /dev/null
      containerPath: /var/run/nvidia-container-devices/{{ $gpu }}
    - hostPath: {{ env "PROJECT_ROOT" }}/models
      containerPath: /mnt/models
      readOnly: true
    - hostPath: ./registry-hosts.toml
      containerPath: /etc/containerd/certs.d/registry.localhost/hosts.toml
      readOnly: true
    - hostPath: {{ env "PROJECT_ROOT" }}/.certs/rootCA.pem
      containerPath: /etc/containerd/certs.d/registry.localhost/rootCA.pem
      readOnly: true
# yaml-language-server-disable
{{- end }}
