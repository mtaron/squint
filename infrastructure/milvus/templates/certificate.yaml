# Proxy server certificate. Its ca.crt (milvus-ca) also verifies client certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milvus-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: milvus-tls
  dnsNames:
    - squint-milvus
    - squint-milvus.{{ .Release.Namespace }}
    - squint-milvus.{{ .Release.Namespace }}.svc
    - squint-milvus.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
  # The proxy only reads its certificate at startup
  duration: 8760h # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: milvus-ca
