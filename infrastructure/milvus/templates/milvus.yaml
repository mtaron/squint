apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: squint
  namespace: {{ .Release.Namespace }}
  labels:
    app: milvus
spec:
  mode: cluster
  components:
    image: milvusdb/milvus:v3.0.5
    volumes:
      - name: tls
        secret:
          secretName: milvus-tls
    volumeMounts:
      - name: tls
        mountPath: /etc/milvus-tls
        readOnly: true
  dependencies:
    msgStreamType: woodpecker
    {{- if .Values.objectStorage.external.enabled }}
    storage:
      external: true
      type: S3
      endpoint: {{ .Values.objectStorage.external.endpoint }}
      secretRef: {{ .Values.objectStorage.external.secretRef }}
    {{- end }}
  config:
    proxy:
      http:
        # REST cannot share the gRPC port when TLS is on.
        port: 8080
    tls:
      serverPemPath: /etc/milvus-tls/tls.crt
      serverKeyPath: /etc/milvus-tls/tls.key
      caPemPath: /etc/milvus-tls/ca.crt
    common:
      security:
        tlsMode: 2
      storage:
        useLoonFFI: true
    dataNode:
      storage:
        format: vortex
    {{- if .Values.objectStorage.external.enabled }}
    minio:
      bucketName: {{ .Values.objectStorage.external.bucketName }}
      rootPath: milvus/squint
      useSSL: {{ .Values.objectStorage.external.useSSL }}
    {{- end }}
