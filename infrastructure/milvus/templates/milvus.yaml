apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: squint
  namespace: {{ .Release.Namespace }}
  labels:
    app: milvus
spec:
  mode: cluster
  components:
    image: milvusdb/milvus:v3.0.2
    proxy:
      volumes:
        - name: tls
          secret:
            secretName: milvus-tls
      volumeMounts:
        - name: tls
          mountPath: /certs
          readOnly: true
  dependencies:
    msgStreamType: woodpecker
    {{- if .Values.objectStorage.external.enabled }}
    storage:
      external: true
      type: S3
      endpoint: {{ .Values.objectStorage.external.endpoint }}
      secretRef: {{ .Values.objectStorage.external.secretRef }}
    {{- end }}
  config:
    common:
      storage:
        useLoonFFI: true
      security:
        # Require a client certificate signed by milvus-ca. This only gates the
        # connection; Milvus does not map certificates to users.
        tlsMode: 2
    tls:
      serverPemPath: /certs/tls.crt
      serverKeyPath: /certs/tls.key
      caPemPath: /certs/ca.crt
    proxy:
      http:
        # The REST API is also served without TLS or auth on the metrics port (9091)
        enabled: false
        # TLS refuses to start when HTTP shares the gRPC port
        port: 8080
    dataNode:
      storage:
        format: vortex
    {{- if .Values.objectStorage.external.enabled }}
    minio:
      bucketName: {{ .Values.objectStorage.external.bucketName }}
      rootPath: milvus/squint
      useSSL: {{ .Values.objectStorage.external.useSSL }}
    {{- end }}
