apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
        - name: ui
          image: {{ required "image is required" .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            # Uploads are capped at 2 GB per request by the app; this leaves room for multipart framing
            - name: BODY_SIZE_LIMIT
              value: "2100M"
            # The AWS SDK for JavaScript ignores AWS_CA_BUNDLE
            - name: NODE_EXTRA_CA_CERTS
              valueFrom:
                configMapKeyRef:
                  name: s3
                  key: AWS_CA_BUNDLE
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: temporal
            - configMapRef:
                name: dragonfly
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
            - configMapRef:
                name: s3
            - secretRef:
                name: s3
            - secretRef:
                name: ui
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: squint-ca
              mountPath: /etc/squint/ca
              readOnly: true
            - name: dragonfly
              mountPath: /etc/squint/dragonfly
              readOnly: true
      volumes:
        - name: squint-ca
          configMap:
            name: squint-ca
        - name: dragonfly
          secret:
            secretName: dragonfly
