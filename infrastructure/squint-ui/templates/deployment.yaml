apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
        - name: ui
          image: {{ required "image is required" .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: temporal
            - configMapRef:
                name: dragonfly
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
            - secretRef:
                name: ui
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Migrations run before the server starts listening
            initialDelaySeconds: 30
          volumeMounts:
            - name: squint-ca
              mountPath: /etc/squint/ca
              readOnly: true
            - name: dragonfly
              mountPath: /etc/squint/dragonfly
              readOnly: true
      volumes:
        - name: squint-ca
          configMap:
            name: squint-ca
        - name: dragonfly
          secret:
            secretName: dragonfly
