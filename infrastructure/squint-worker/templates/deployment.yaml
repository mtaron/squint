apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if gt (int .Values.gpu) 0 }}
  # A surge pod would wait forever for a GPU the old pod still holds
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: {{ required "image is required" .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: temporal
            {{- if .Values.s3.enabled }}
            - configMapRef:
                name: s3
            - secretRef:
                name: s3
            {{- end }}
            {{- if .Values.dragonfly.enabled }}
            - configMapRef:
                name: dragonfly
            {{- end }}
            {{- if .Values.milvus.enabled }}
            - configMapRef:
                name: milvus
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
            {{- end }}
          {{- if gt (int .Values.gpu) 0 }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu }}
          {{- end }}
          volumeMounts:
            - name: squint-ca
              mountPath: /etc/squint/ca
              readOnly: true
            {{- if .Values.dragonfly.enabled }}
            - name: dragonfly
              mountPath: /etc/squint/dragonfly
              readOnly: true
            {{- end }}
            {{- if .Values.milvus.enabled }}
            - name: milvus
              mountPath: /etc/squint/milvus
              readOnly: true
            {{- end }}
            {{- if .Values.models.hostPath }}
            - name: models
              mountPath: /mnt/models
              readOnly: true
            {{- end }}
      volumes:
        - name: squint-ca
          configMap:
            name: squint-ca
        {{- if .Values.dragonfly.enabled }}
        - name: dragonfly
          secret:
            secretName: dragonfly
        {{- end }}
        {{- if .Values.milvus.enabled }}
        - name: milvus
          secret:
            secretName: milvus
        {{- end }}
        {{- if .Values.models.hostPath }}
        - name: models
          hostPath:
            path: {{ .Values.models.hostPath }}
            type: Directory
        {{- end }}
