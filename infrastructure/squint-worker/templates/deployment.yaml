apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: {{ required "image is required" .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.s3.enabled .Values.dragonfly.enabled .Values.milvus.enabled }}
          envFrom:
            {{- if .Values.s3.enabled }}
            - configMapRef:
                name: s3
            - secretRef:
                name: s3
            {{- end }}
            {{- if .Values.dragonfly.enabled }}
            - configMapRef:
                name: dragonfly
            {{- end }}
            {{- if .Values.milvus.enabled }}
            - configMapRef:
                name: milvus
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: squint-ca
              mountPath: /etc/squint/ca
              readOnly: true
            {{- if .Values.dragonfly.enabled }}
            - name: dragonfly
              mountPath: /etc/squint/dragonfly
              readOnly: true
            {{- end }}
            {{- if .Values.milvus.enabled }}
            - name: milvus
              mountPath: /etc/squint/milvus
              readOnly: true
            {{- end }}
      volumes:
        - name: squint-ca
          configMap:
            name: squint-ca
        {{- if .Values.dragonfly.enabled }}
        - name: dragonfly
          secret:
            secretName: dragonfly
        {{- end }}
        {{- if .Values.milvus.enabled }}
        - name: milvus
          secret:
            secretName: milvus
        {{- end }}
