apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  workerOptions:
    connectionRef:
      name: {{ .Values.temporal.connection }}
    temporalNamespace: {{ .Values.temporal.namespace }}
  rollout:
    strategy: {{ .Values.rollout.strategy }}
    {{- if eq .Values.rollout.strategy "Progressive" }}
    steps:
      {{- toYaml .Values.rollout.steps | nindent 6 }}
    {{- end }}
  sunset:
    {{- toYaml .Values.sunset | nindent 4 }}
  deployment:
    {{- if not .Values.autoscaling.enabled }}
    replicas: {{ .Values.replicas }}
    {{- end }}
    template:
      metadata:
        labels:
          app.kubernetes.io/name: {{ .Release.Name }}
      spec:
        {{- if gt (int .Values.gpu) 0 }}
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        {{- end }}
        containers:
          - name: worker
            image: {{ required "image is required" .Values.image }}
            imagePullPolicy: {{ .Values.imagePullPolicy }}
            {{- with .Values.command }}
            command:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            ports:
              - name: metrics
                containerPort: 9090
            {{- if or .Values.env .Values.debug }}
            env:
              {{- range $name, $value := .Values.env }}
              - name: {{ $name }}
                value: {{ $value | quote }}
              {{- end }}
              {{- if .Values.debug }}
              - name: PYTHONPATH
                value: /opt/debugpy
              {{- end }}
            {{- end }}
            {{- if or .Values.s3.enabled .Values.dragonfly.enabled .Values.milvus.enabled .Values.postgres.enabled }}
            envFrom:
              {{- if .Values.s3.enabled }}
              - configMapRef:
                  name: s3
              - secretRef:
                  name: s3
              {{- end }}
              {{- if .Values.dragonfly.enabled }}
              - configMapRef:
                  name: dragonfly
              {{- end }}
              {{- if .Values.milvus.enabled }}
              - configMapRef:
                  name: milvus
              {{- end }}
              {{- if .Values.postgres.enabled }}
              - configMapRef:
                  name: postgres
              - secretRef:
                  name: postgres
              {{- end }}
            {{- end }}
            {{- if gt (int .Values.gpu) 0 }}
            resources:
              limits:
                nvidia.com/gpu: {{ .Values.gpu }}
            {{- end }}
            volumeMounts:
              - name: squint-ca
                mountPath: /etc/squint/ca
                readOnly: true
              {{- if .Values.dragonfly.enabled }}
              - name: dragonfly
                mountPath: /etc/squint/dragonfly
                readOnly: true
              {{- end }}
              {{- if .Values.milvus.enabled }}
              - name: milvus
                mountPath: /etc/squint/milvus
                readOnly: true
              {{- end }}
              {{- if .Values.models.hostPath }}
              - name: models
                mountPath: /mnt/models
                readOnly: true
              {{- end }}
              {{- if .Values.debug }}
              - name: debugpy
                mountPath: /opt/debugpy
                readOnly: true
              {{- end }}
        volumes:
          - name: squint-ca
            configMap:
              name: squint-ca
          {{- if .Values.dragonfly.enabled }}
          - name: dragonfly
            secret:
              secretName: dragonfly
          {{- end }}
          {{- if .Values.milvus.enabled }}
          - name: milvus
            secret:
              secretName: milvus
          {{- end }}
          {{- if .Values.models.hostPath }}
          - name: models
            hostPath:
              path: {{ .Values.models.hostPath }}
              type: Directory
          {{- end }}
          {{- if .Values.debug }}
          - name: debugpy
            image:
              # Tilt replaces this with its build of the image
              reference: squint-debugpy
          {{- end }}
