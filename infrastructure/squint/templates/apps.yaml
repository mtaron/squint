{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: squint
spec:
  replicas: 1
  {{- if $.Values.dev.enabled }}
  # One debuggee at a time; port-forward must never pick a terminating pod
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: squint
    spec:
      containers:
        - name: {{ $name }}
          {{- if $.Values.dev.enabled }}
          image: squint-{{ $name }}:dev
          imagePullPolicy: Never
          workingDir: /app/apps/{{ $name }}
          args:
            {{- if $.Values.dev.waitForClient }}
            - --wait-for-client
            {{- end }}
            - {{ $app.script }}
          ports:
            - name: debugpy
              containerPort: 5678
          # Ready once debugpy is listening, so rollout status gates attaching.
          # Checks for the listening socket (port 5678 = 0x162E) rather than
          # connecting, which debugpy would take as a client.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - grep -qE ':162E [0-9A-F]+:0000 0A' /proc/net/tcp /proc/net/tcp6
            periodSeconds: 1
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
          {{- else }}
          image: {{ $.Values.image.repository }}-{{ $name }}:{{ $.Values.image.tag }}
          command:
            - python
            - {{ $app.script }}
          {{- end }}
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc:7233
            - name: REDIS_URL
              value: redis://squint.dragonfly.svc:6379
            - name: PGHOST
              value: postgres-cluster-rw.postgres.svc
            - name: PGDATABASE
              value: app
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: AWS_ENDPOINT_URL
              value: http://versitygw.versitygw.svc:7070
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: accessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secretAccessKey
      {{- if $.Values.dev.enabled }}
      volumes:
        - name: source
          hostPath:
            path: {{ $.Values.dev.sourcePath }}
            type: Directory
      {{- end }}
{{- end }}
