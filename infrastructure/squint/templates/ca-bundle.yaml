apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: squint-ca
spec:
  sources:
    - secret:
        name: squint-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
