apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly
  namespace: {{ .Release.Namespace }}
spec:
  secretName: dragonfly
  commonName: squint
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: squint-ca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly
  namespace: {{ .Release.Namespace }}
data:
  REDIS_URL: {{ printf "rediss://squint.dragonfly.svc.cluster.local:6379?ssl_ca_certs=%s&ssl_certfile=/etc/squint/dragonfly/tls.crt&ssl_keyfile=/etc/squint/dragonfly/tls.key" .Values.caBundlePath | quote }}
