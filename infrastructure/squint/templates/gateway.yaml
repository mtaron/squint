apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.devListeners }}
    - protocol: HTTP
      port: 19530
      name: milvus-grpc
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: GRPCRoute
    - protocol: HTTP
      port: 7233
      name: temporal-grpc
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: GRPCRoute
    {{- end }}
