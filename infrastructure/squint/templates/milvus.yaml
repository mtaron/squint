apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milvus
  namespace: {{ .Release.Namespace }}
spec:
  secretName: milvus
  commonName: squint
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: squint-ca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus
  namespace: {{ .Release.Namespace }}
data:
  MILVUS_URI: https://squint-milvus.milvus.svc.cluster.local:19530
  MILVUS_CA_PEM_PATH: {{ .Values.caBundlePath | quote }}
  MILVUS_CLIENT_PEM_PATH: /etc/squint/milvus/tls.crt
  MILVUS_CLIENT_KEY_PATH: /etc/squint/milvus/tls.key
