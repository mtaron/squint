# Run apps from source mounted into the kind nodes, under debugpy.
dev:
  enabled: false
  # Node path where the kind cluster mounts the repository's squint/ folder; see cluster.yaml
  sourcePath: /squint
  # Hold each app at startup until a debugger attaches
  waitForClient: true

image:
  repository: squint
  tag: latest

# One Deployment per app. Each key is a folder under squint/.
apps:
  ingest:
    script: main.py
