[settings]
lockfile = true

[settings.npm]
package_manager = "pnpm"

[tools]
# Python should track the version in ubuntu:26.04 image
python = { version = "3.14.4", postinstall = "mise sync python --uv" }
node = "lts"

# tools
uv = "latest"
pnpm = "latest"
task = "latest"
yq = "latest"
jq = "latest"
helm = "latest"
helmfile = "latest"
helm-diff = { version = "latest", depends = ["helm"], postinstall = "helm plugin uninstall diff >/dev/null 2>&1 || true; helm plugin install $MISE_TOOL_INSTALL_PATH/diff" }
kubectl = "latest"
mkcert = "latest"
"github:temporalio/cli" = "latest"
tilt = "latest"
hostctl = "latest"
prek = "latest"

# python
ty = "latest"
ruff = "latest"

"pypi:hf" = "latest"

# dev cluster
kind = "latest"
"go:sigs.k8s.io/cloud-provider-kind" = "latest"
"go:github.com/NVIDIA/nvkind/cmd/nvkind" = "latest"

[env]
PROJECT_ROOT = "{{config_root}}"
# Keep in sync with tools.python; uv otherwise picks the newest managed Python
UV_PYTHON = "3.14.4"

