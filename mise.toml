[settings]
lockfile = true

[settings.npm]
package_manager = "pnpm"

[tools]
# Python should track the version in ubuntu:26.04 image
# Use `task ubuntu-python-version` to check for a newer version
python = { version = "3.14.4", postinstall = "mise sync python --uv" }
node = "lts"

# tools
aws = "latest"
uv = "latest"
pnpm = "latest"
task = "latest"
yq = "latest"
jq = "latest"
helm = "latest"
helmfile = "latest"
helm-diff = {
    version = "latest",
    filter_bins = "helm-diff",
    depends = ["helm"],
    postinstall = "helm plugin uninstall diff >/dev/null 2>&1 || true; helm plugin install $MISE_TOOL_INSTALL_PATH/diff"
}
kubectl = "latest"
kustomize = "latest"
mkcert = "latest"
"github:temporalio/cli" = "latest"
"github:tomlsmith/tomlsmith" = "latest"
tilt = "latest"
hostctl = "latest"

# The Git hook prek generates hardcodes the installed version's path
prek = {
    version = "latest",
    postinstall = { run = 'prek --cd "$MISE_CONFIG_ROOT" install', when = "always" },
}

# python
ty = "latest"
ruff = "latest"
"pypi:hf" = "latest"

# dev cluster
kind = "latest"
"go:sigs.k8s.io/cloud-provider-kind" = "latest"
"go:github.com/NVIDIA/nvkind/cmd/nvkind" = "latest"

[env]
PROJECT_ROOT = "{{config_root}}"
# Keep in sync with tools.python; uv otherwise picks the newest managed Python
UV_PYTHON = "3.14.4"
