# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = {
  glob = [
    "**/*.lock",
    "**/*-lock.json",
    "**/*-lock.yaml",
    "**/*.svg",
    ".claude/skills/**",
    "squint/javascript/db/drizzle/**",
  ]
}

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    language = "system",
    entry = "mise exec -- ruff check --force-exclude --fix",
    types_or = ["python", "pyi", "jupyter"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    language = "system",
    entry = "mise exec -- ruff format --force-exclude",
    types_or = ["python", "pyi", "jupyter", "markdown"],
    require_serial = true,
  },
]
