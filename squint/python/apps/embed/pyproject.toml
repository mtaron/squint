[project]
name = "embed"
version = "0.1.0"
description = "squint embedding worker"
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "accelerate>=1.15.0",
    "kernels>=0.17.2,<0.18",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "sentence-transformers>=6.2.0",
    "squint-core",
    "squint-vector",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[tool.uv.sources]
squint-core = { path = "../../packages/squint-core", editable = true }
squint-vector = { path = "../../packages/squint-vector", editable = true }

torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Hub kernels, pinned in kernels.lock (`kernels lock .`) and fetched by `task download-models`.
# After changing or relocking a kernel, run `task download-models --force` to fetch the new build.
[tool.kernels.dependencies]
"kernels-community/flash-attn2" = 3

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-testmon>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = ["activities", "encoder", "token_compression"]
