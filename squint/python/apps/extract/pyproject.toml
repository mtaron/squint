[project]
name = "extract"
version = "0.1.0"
description = "squint extraction worker"
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "squint-core",
    "squint-vector",
]

[tool.uv.sources]
squint-core = { path = "../../packages/squint-core", editable = true }
squint-vector = { path = "../../packages/squint-vector", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
