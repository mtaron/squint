[project]
name = "ingest"
version = "0.1.0"
description = "Document ingestion for squint"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jdeskew>=0.4.2",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.13.0",
    "squint-core",
]

[tool.uv.sources]
squint-core = { path = "../../packages/squint-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-testmon>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = ["activities", "rasterize", "workflows"]
