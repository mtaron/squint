[project]
name = "ingest"
version = "0.1.0"
description = "Document ingestion for squint"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "squint-core",
]

[tool.uv.sources]
squint-core = { path = "../../packages/squint-core", editable = true }

[dependency-groups]
dev = [
    "pikepdf>=10.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
