[project]
name = "squint-core"
version = "0.1.0"
description = "Shared library for squint"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "capo-s3>=0.29.0",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
