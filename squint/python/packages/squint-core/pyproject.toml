[project]
name = "squint-core"
version = "0.1.0"
description = "Shared library for squint"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "capo-s3>=0.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "temporalio[opentelemetry]>=1.34.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["squint_core"]
