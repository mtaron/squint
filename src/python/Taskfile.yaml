# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  APPS: [ingest]
  NAMESPACE: squint

tasks:
  build:
    desc: Build and load a Python dev image
    label: image-{{.APP}}
    requires:
      vars: [APP]
    sources:
      - Dockerfile.dev
      - Dockerfile.dev.dockerignore
      - "apps/{{.APP}}/pyproject.toml"
      - "apps/{{.APP}}/uv.lock"
      - packages/*/pyproject.toml
    status:
      - docker exec squint-worker crictl inspecti --quiet docker.io/library/squint-{{.APP}}:dev
    cmds:
      - docker build --file Dockerfile.dev --build-arg APP={{.APP}} --tag squint-{{.APP}}:dev .
      - kind load docker-image squint-{{.APP}}:dev --name squint --nodes squint-worker

  build-all:
    desc: Build and load the Python dev images for all apps
    cmds:
      - for: { var: APPS }
        task: build
        vars: { APP: "{{.ITEM}}" }

  restart:
    desc: Restart an app's deployment in the dev cluster
    requires:
      vars: [APP]
    cmds:
      - task: build
        vars: { APP: "{{.APP}}" }
      - kubectl --namespace {{.NAMESPACE}} rollout restart deployment/{{.APP}}
      - kubectl --namespace {{.NAMESPACE}} rollout status deployment/{{.APP}}

  debug:
    desc: Restart an app and forward its debugpy port to localhost
    requires:
      vars: [APP]
    vars:
      LOCAL_PORT: '{{default "5678" .LOCAL_PORT}}'
    cmds:
      - task: restart
        vars: { APP: "{{.APP}}" }
      - kubectl --namespace {{.NAMESPACE}} port-forward deployment/{{.APP}} {{.LOCAL_PORT}}:5678
